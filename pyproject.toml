[project]
name = "jevjudge"
version = "0.1.0"
description = "Pointwise evaluation of Jev (TypeSafe) vs Claude models as judges"
requires-python = ">=3.11"
dependencies = [
    "langchain-typesafe",
    "langchain-anthropic",
    "datasets",
    "numpy",
    "scipy",
    "scikit-learn",
    "tqdm",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jevjudge = "jevjudge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevjudge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
